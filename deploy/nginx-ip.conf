# /etc/nginx/sites-available/velcode-ip
# Для тестирования по IP (без SSL).
# Установка:
#   cp deploy/nginx-ip.conf /etc/nginx/sites-available/velcode-ip
#   rm -f /etc/nginx/sites-enabled/default
#   ln -s /etc/nginx/sites-available/velcode-ip /etc/nginx/sites-enabled/velcode-ip
#   nginx -t && systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /admin {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /uploads/ {
        alias /var/www/velcode/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
    }

    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|otf)$ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}
